<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>记忆可视化</title>
<style>
:root{color-scheme:light dark;--bg:#f8f8f6;--panel:#fff;--text:#292d2b;--muted:#616a65;--line:#e0e5e1;--accent:#285f4b;--soft:#e7f2eb;--warn:#92511b;--risk:#b13b36}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2783de;outline-offset:2px}.wrap{max-width:1160px;margin:auto;padding:34px 30px 64px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}h1{font-size:30px;letter-spacing:-.04em;margin:0}h2{font-size:21px;margin:0}h3{font-size:16px;margin:0}p{margin:0}.eyebrow{color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.muted{color:var(--muted);font-size:14px}.snapshot{text-align:right}.tabs{display:flex;gap:8px;margin:28px 0 24px;border-bottom:1px solid var(--line);overflow-x:auto}.tab{background:transparent;border:0;border-bottom:3px solid transparent;padding:12px 18px;white-space:nowrap;color:var(--muted)}.tab.active{border-color:var(--accent);color:var(--text);font-weight:700}.banner{padding:18px;border:1px solid #d8b47f;background:#fbebde;color:#653d16;border-radius:8px;margin-bottom:24px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:18px}.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:20px}.big{font-size:32px;letter-spacing:-.04em;font-weight:700}.unit{font-size:15px;color:var(--muted);font-weight:400}.track{position:relative;height:14px;border-radius:8px;background:var(--line);margin:24px 0 12px}.fill{height:100%;border-radius:8px;background:var(--accent)}.marker{position:absolute;top:-6px;width:3px;height:26px;background:var(--warn)}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{border:1px solid var(--line);border-radius:8px;padding:14px;text-align:left;background:transparent;min-height:84px}.stat strong{display:block;font-size:24px}.stat:hover,.segment:hover{border-color:var(--accent)}.stack>*+*{margin-top:16px}.keyval{padding:9px 0;border-bottom:1px solid var(--line)}.keyval:last-child{border:0}.tag{display:inline-block;font-size:13px;padding:3px 8px;border-radius:5px;background:var(--soft);color:var(--accent);font-weight:600}.tag.warn{background:#fbebde;color:#854712}.tag.fail{background:#fce9e7;color:#9c2e28}.timeline{display:flex;gap:10px;overflow-x:auto;padding:12px 1px 16px}.segment{flex:0 0 150px;text-align:left;border:1px solid var(--line);border-top:4px solid var(--accent);background:var(--panel);border-radius:8px;padding:14px}.segment.backfill{border-top-color:#d5803b}.segment.failed{border-top-color:#e56458}.segment strong,.segment span{display:block}.segment span{margin-top:6px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,select{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:9px;min-height:44px}input{flex:1;min-width:180px}select{max-width:180px}.button{border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:9px 14px;min-height:44px}.button.primary{background:var(--accent);color:white;border-color:var(--accent)}.list-item{padding:16px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border:0}.item-title{font-weight:650;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:14px;margin-top:7px}.fact-actions{margin-top:10px}details>summary{cursor:pointer;color:var(--accent);min-height:30px}details>div{padding:10px 0}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:10px}th{color:var(--muted)}.table-wrap{overflow-x:auto}.empty{color:var(--muted);padding:20px 0}.pager{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:16px}.screen-title{margin-bottom:18px}.screen-title p{margin-top:5px}.error{color:var(--risk)}@media(max-width:720px){.wrap{padding:24px 16px 48px}header{display:block}.snapshot{text-align:left;margin-top:14px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.card{padding:18px}.row{align-items:flex-start;flex-wrap:wrap}.filters>*{flex:1 1 44%;max-width:none}}
@media(prefers-color-scheme:dark){:root{--bg:#191919;--panel:#222724;--text:#f4f6f4;--muted:#b4beb8;--line:#414b45;--accent:#92d5ad;--soft:#293e31;--warn:#e5b074;--risk:#f59b94}.button.primary{color:#162219}.banner{background:#3e3021;color:#f6d2a7;border-color:#896943}.tag.warn{background:#483625;color:#edc18b}.tag.fail{background:#4a2b2a;color:#f2ada7}}
</style></head><body><main class="wrap"><header><div><p class="eyebrow">DSH COMPANION · READ ONLY</p><h1>记忆可视化</h1><p class="muted">一份快照，三个视角。</p></div><div class="snapshot"><span class="muted">快照更新时间 · 上海</span><p id="snapshot">正在读取…</p></div></header>
<nav class="tabs" aria-label="页面导航"><button class="tab active" data-tab="today">今天</button><button class="tab" data-tab="timeline">上下文时间轴</button><button class="tab" data-tab="facts">记忆库</button></nav><div id="notice" role="status"></div><section id="app" aria-live="polite"></section></main>
<script>
const app=document.getElementById('app'),notice=document.getElementById('notice');let active='today',selectedDate='',page=1;
const esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'—':Number(n).toLocaleString('zh-CN');
const time=n=>n==null?'—':new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(typeof n==='number'?n*1000:n));
async function api(path){const r=await fetch(path);const v=await r.json();if(!r.ok)throw Error(v.error||'读取失败');if(v.available===false)throw Error(v.message);return v}
function sensitive(content,flag){return flag?`<details><summary>敏感内容 · 点击展开</summary><div>${content}</div></details>`:content}
function eventList(rows){if(!rows.length)return '<p class="empty">暂无事件</p>';return `<div class="table-wrap"><table><thead><tr><th>时间</th><th>动作</th><th>执行者</th><th>原因 / 事实</th></tr></thead><tbody>${rows.map(e=>`<tr><td>${esc(time(e.at))}</td><td>${esc(e.action)}</td><td>${esc(e.actor)}</td><td>${sensitive(`${esc(e.reason)}${e.statement?`<br>${esc(e.statement)}`:''}`,e.sensitive)}</td></tr>`).join('')}</tbody></table></div>`}
async function getStatus(){const v=await api('/api/status');document.getElementById('snapshot').textContent=time(v.snapshot_mtime)}
function heading(title,sub){return `<div class="screen-title"><h2>${title}</h2><p class="muted">${sub}</p></div>`}
async function renderToday(){const d=await api('/api/today');selectedDate=d.date;const n=(d.token?.input_tokens??0)+(d.token?.cache_hit_tokens??0), pct=Math.max(0,Math.min(100,n/10000)), floor=d.compact_floor, floorPct=floor==null?null:Math.max(0,Math.min(100,floor/10000));const all=new Map(d.counts.map(x=>[x.action,x.count]));for(const a of ['ADD','REINFORCE','UPDATE','TOMBSTONE','PURGED'])if(!all.has(a))all.set(a,0);
app.innerHTML=heading('今天',`${esc(d.date)} · Asia/Shanghai`)+`<div class="grid"><div><div class="card"><div class="card-head"><h3>上下文容量</h3><span class="muted">最新 main 请求</span></div><div class="big">${d.token?fmt(n):'—'} <span class="unit">/ 1,000,000 tokens</span></div><div class="track" role="meter" aria-label="上下文 tokens" aria-valuemin="0" aria-valuemax="1000000" aria-valuenow="${Math.min(n,1000000)}"><div class="fill" style="width:${pct}%"></div>${floorPct===null?'':`<div class="marker" style="left:${floorPct}%" title="压缩水位 ${esc(fmt(floor))}"></div>`}</div><div class="row muted"><span>输入 + 缓存命中</span><span>压缩水位 ${esc(fmt(floor))}</span></div></div><div class="card"><div class="card-head"><h3>今日动态</h3><span class="muted">选择动作查看事件</span></div><div class="stats">${[...all].map(([a,c])=>`<button class="stat" data-action="${esc(a)}"><span class="muted">${esc(a)}</span><strong>${fmt(c)}</strong></button>`).join('')}</div><div id="event-results"></div></div></div><aside><div class="card stack"><div class="card-head"><h3>后台状态</h3><span class="tag">快照</span></div><div class="keyval"><p class="muted">回填游标</p><strong>${esc(fmt(d.backfill_cursor))}</strong></div><div class="keyval"><p class="muted">当日回填</p><strong>${esc(d.backfill_day?.date)} · ${esc(fmt(d.backfill_day?.count))} / 6</strong></div><div class="keyval"><p class="muted">最近巩固</p><strong>${d.latest?esc(d.latest.kind)+' · '+esc(d.latest.trigger):'—'}</strong><p class="meta">${d.latest?esc(d.latest.status)+' · '+(d.latest.finished_at==null?'进行中':esc(fmt(d.latest.finished_at-d.latest.started_at))+' 秒'):'暂无记录'}</p></div><div class="keyval"><p class="muted">待处理提醒</p><strong>${fmt(d.reminders)} / 50</strong></div></div></aside></div>`;
app.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{try{const v=await api('/api/events?'+new URLSearchParams({date:selectedDate,action:b.dataset.action}));document.getElementById('event-results').innerHTML=`<h3 style="margin-top:24px">${esc(b.dataset.action)} 事件</h3>${eventList(v.events)}`}catch(e){document.getElementById('event-results').textContent=e.message}})}
async function renderTimeline(){const d=await api('/api/timeline');app.innerHTML=heading('上下文时间轴','按 upto_seq 排列 · 橙色为回填，红色为失败 · 可横向滚动')+`<div class="card"><div class="row"><div><span class="muted">主水位</span><p class="big">${esc(fmt(d.watermark))}</p></div><div><span class="muted">回填游标</span><p class="big">${esc(fmt(d.backfill_cursor))}</p></div></div><div class="track" aria-label="水位标记">${d.watermark==null?'':`<div class="marker" style="left:${Math.max(0,Math.min(100,100*d.watermark/Math.max(1,...d.consolidations.map(c=>c.upto_seq))))}%;background:var(--accent)" title="主水位 ${esc(fmt(d.watermark))}"></div>`}${d.backfill_cursor==null?'':`<div class="marker" style="left:${Math.max(0,Math.min(100,100*d.backfill_cursor/Math.max(1,...d.consolidations.map(c=>c.upto_seq))))}%" title="回填游标 ${esc(fmt(d.backfill_cursor))}"></div>`}</div><p class="muted">绿色标记：主水位 · 橙色标记：回填游标</p><div class="timeline">${d.consolidations.map(c=>`<button class="segment ${c.trigger==='backfill'?'backfill':''} ${c.status==='failed'?'failed':''}" data-id="${esc(c.id)}"><strong>${esc(c.kind)}</strong><span class="muted">seq ${esc(fmt(c.upto_seq))}</span><span class="tag ${c.status==='failed'?'fail':c.trigger==='backfill'?'warn':''}">${esc(c.status)} · ${esc(c.trigger)}</span></button>`).join('')||'<p class="empty">暂无巩固记录</p>'}</div><div id="episodes"><p class="muted">选择一段查看情景记忆。</p></div></div>`;
app.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{try{const d=await api('/api/consolidations/'+encodeURIComponent(b.dataset.id)+'/episodes');document.getElementById('episodes').innerHTML=`<h3>情景记忆 · ${esc(b.dataset.id)}</h3>`+(d.episodes.map(e=>`<div class="list-item">${sensitive(`<div class="item-title">${esc(e.title)}</div><p>${esc(e.summary)}</p>`,e.sensitive)}<p class="meta">${esc(time(e.started_at))} · ${esc(e.status)}</p></div>`).join('')||'<p class="empty">该段没有情景记忆</p>')}catch(e){document.getElementById('episodes').textContent=e.message}})}
const options={kind:['identity','relation','preference','project','knowledge','lifestyle','mood','other'],source_kind:['user_explicit','turn','task','consolidated','inferred'],salience:['trivial','normal','notable','explicit','pinned'],status:['active','dormant','superseded','tombstoned','all']};
const names={scope:'范围',kind:'类型',source_kind:'来源',salience:'显著性',status:'状态',user_explicit:'亲口说的',inferred:'推断的',all:'全部'};
let filters={status:'active'};
async function renderFacts(){const query=new URLSearchParams({...filters,page:String(page)});const d=await api('/api/facts?'+query);app.innerHTML=heading('记忆库','仅展示快照中的事实 · 每页 50 条')+`<div class="card"><form class="filters" id="filters"><input name="q" aria-label="搜索事实" placeholder="搜索事实" value="${esc(filters.q||'')}"><input name="scope" aria-label="范围" placeholder="scope · 全部" value="${esc(filters.scope||'')}">${Object.entries(options).map(([k,vals])=>`<select name="${k}" aria-label="${names[k]}">${k==='status'?'':`<option value="">${names[k]} · 全部</option>`}${vals.map(v=>`<option value="${esc(v)}" ${filters[k]===v?'selected':''}>${esc(names[v]||v)}</option>`).join('')}</select>`).join('')}<button class="button primary">筛选</button></form><p class="muted">${fmt(d.total)} 条结果</p><div>${d.facts.map(f=>`<div class="list-item">${sensitive(`<div class="item-title">${esc(f.statement)}</div>${f.kind===undefined ? `<p class="meta">${esc(f.status)}</p>` : `<p class="meta">${esc(f.kind)} · ${esc(names[f.source_kind]||f.source_kind)} · ${esc(f.salience)} · ${esc(f.status)} · 使用 ${esc(fmt(f.used_count))} 次</p>`}`,f.sensitive)}<p class="meta">最近强化 ${esc(time(f.last_reinforced_at))}</p><div class="fact-actions"><button class="button" data-fact="${esc(f.id)}">查看事件</button><div id="events-${esc(f.id)}"></div></div></div>`).join('')||'<p class="empty">没有匹配的事实</p>'}</div><div class="pager"><button class="button" id="prev" ${page<=1?'disabled':''}>上一页</button><span>${page} / ${Math.max(1,Math.ceil(d.total/50))}</span><button class="button" id="next" ${page*50>=d.total?'disabled':''}>下一页</button></div></div>`;
app.querySelector('#filters').onsubmit=e=>{e.preventDefault();filters=Object.fromEntries(new FormData(e.currentTarget));page=1;render()};app.querySelector('#prev').onclick=()=>{page--;render()};app.querySelector('#next').onclick=()=>{page++;render()};app.querySelectorAll('[data-fact]').forEach(b=>b.onclick=async()=>{try{const d=await api('/api/facts/'+encodeURIComponent(b.dataset.fact)+'/events');b.nextElementSibling.innerHTML=eventList(d.events)}catch(e){b.nextElementSibling.textContent=e.message}})}
async function render(){try{notice.innerHTML='';await getStatus();if(active==='today')await renderToday();else if(active==='timeline')await renderTimeline();else await renderFacts()}catch(e){document.getElementById('snapshot').textContent='不可用';notice.innerHTML=`<div class="banner">${esc(e.message)}</div>`;app.innerHTML=''}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});render();
</script></body></html>
