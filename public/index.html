<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>记忆手帐</title>
<style>

*{box-sizing:border-box}body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Noto Sans SC",sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #a66b36;outline-offset:3px}button:disabled{opacity:.55;cursor:default}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:"Songti SC","Noto Serif SC",serif}h1{font-size:34px;letter-spacing:.08em}h2{font-size:26px}h3{font-size:19px}small,.muted,.meta{font-size:14px;color:var(--muted)}.num,.big{font-variant-numeric:tabular-nums}.wrap{max-width:1160px;margin:auto;padding:32px 32px 72px}.mast{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;gap:16px;align-items:center}.leaf{width:42px;height:42px;color:var(--accent)}.eyebrow{font:700 12px/1.4 system-ui;letter-spacing:.16em;color:var(--accent)}.mast-right{display:flex;align-items:center;gap:22px}.calendar{display:flex;align-items:center;gap:8px}.calendar strong{font:700 44px/1 Georgia,serif}.calendar span{font-size:14px;color:var(--muted)}.snapshot{border:1px dashed var(--muted);border-radius:50%;width:135px;height:88px;display:grid;place-content:center;text-align:center;transform:rotate(3deg);font-size:12px;color:var(--muted)}.snapshot p{font-size:12px}.tabs{display:flex;gap:10px;border-bottom:1px solid var(--line);margin:28px 0 32px;overflow-x:auto}.tab{border:0;background:transparent;padding:12px 22px;min-height:48px;white-space:nowrap;color:var(--muted);border-bottom:3px solid transparent}.tab.active{border-color:var(--accent);color:var(--ink);font-weight:700}.banner{position:relative;padding:25px;background:var(--peach);color:#49342b;border:1px solid #b79272;border-radius:12px;box-shadow:2px 5px 0 var(--shadow)}.screen-title{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:0 0 20px}.screen-title p{margin-top:5px}.section-label{letter-spacing:.13em;font:700 12px system-ui;color:var(--accent);text-transform:uppercase}.grid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(270px,1fr);gap:22px}.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:25px;box-shadow:3px 5px 0 var(--shadow);margin-bottom:22px}.card.taped:before{content:"";position:absolute;top:-7px;left:38%;width:76px;height:17px;transform:rotate(-3deg);background:var(--tape)}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:16px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.big{font:700 30px/1.2 system-ui;letter-spacing:-.04em}.unit{font-size:14px;color:var(--muted);font-weight:400}.gauge{display:flex;align-items:center;gap:24px}.ring{position:relative;width:190px;flex:0 0 190px;aspect-ratio:1}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring .ring-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.ring .big{font-size:27px}.gauge-text{flex:1}.gauge-text p+p{margin-top:8px}.keyline{border-top:1px dashed var(--line);padding-top:15px;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.stat{min-height:105px;padding:11px;border:1px solid rgba(73,52,43,.2);border-radius:10px;text-align:left;color:#49342b;background:var(--sand);box-shadow:1px 3px 0 var(--shadow)}.stat:nth-child(5n+2){background:var(--sage)}.stat:nth-child(5n+3){background:var(--peach)}.stat:nth-child(5n+4){background:var(--lilac)}.stat:nth-child(5n+5){background:var(--rose)}.stat b,.stat strong,.stat small{display:block}.stat b{font-size:15px}.stat small{font-size:12px;color:#49342b}.stat strong{font-size:23px}.stat:hover{outline:2px solid var(--accent)}.week-legend,.legend{display:flex;flex-wrap:wrap;gap:8px 15px;margin:12px 0}.legend span,.week-legend span{font-size:13px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--swatch)}.week-plot{width:100%;height:160px;display:block}.week-plot text{fill:var(--muted);font:12px system-ui}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.keyval{padding:12px 0;border-bottom:1px dashed var(--line)}.keyval:last-child{border:0}.boxes{display:flex;gap:5px;margin-top:8px}.box{display:grid;place-items:center;width:26px;height:26px;border:1px solid var(--accent);border-radius:5px;font-size:16px}.box.on{background:var(--sage);color:#344b35}.progress{height:10px;border-radius:5px;background:var(--line);margin-top:8px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--accent)}.timeline{display:flex;position:relative;gap:16px;overflow-x:auto;padding:28px 4px 20px}.timeline:before{content:"";position:absolute;top:50px;left:0;right:0;border-top:3px solid var(--line)}.node{flex:0 0 150px;position:relative;min-height:128px;border:0;background:transparent;text-align:left;padding:0 6px;color:var(--ink)}.node-icon{display:grid;place-items:center;width:42px;height:42px;background:var(--sage);border:2px solid var(--accent);border-radius:50%;margin-bottom:10px;color:#334c33;font-weight:700}.node.deep .node-icon{border-radius:8px;transform:rotate(45deg)}.node.deep .node-icon span{transform:rotate(-45deg)}.node.forget_flush .node-icon{border-radius:50% 50% 8px 8px}.node.backfill .node-icon{background:var(--peach);border-color:#935b31}.node.failed .node-icon{background:var(--rose);border-color:var(--red);color:var(--red)}.node strong,.node small{display:block}.bookmarks{display:flex;gap:12px;flex-wrap:wrap}.bookmark{background:var(--sage);color:#344b35;padding:10px 14px;border-radius:6px 6px 2px 2px;font-weight:700}.bookmark:nth-child(2){background:var(--peach);color:#634329}.episode-grid,.facts-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.episode,.fact{padding:18px;border:1px solid var(--line);background:var(--paper);border-radius:12px;box-shadow:2px 3px 0 var(--shadow);overflow-wrap:anywhere}.fact{border-left:7px solid var(--kind,#ad9988)}.fact.tombstoned{background:var(--bg)}.fact.tombstoned .item-title{text-decoration:line-through}.item-title{font-weight:700;font-size:17px}.fact .meta,.episode .meta{margin-top:8px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tiny-icon{width:14px;height:14px;vertical-align:-2px}.tag{font-size:13px;padding:4px 8px;border-radius:6px;background:var(--bg);color:var(--ink)}.fact-actions{margin-top:12px}.button{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:9px 13px;min-height:44px}.button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.filter-line{display:flex;gap:10px}.filter-line input{flex:1;min-width:80px}[hidden]{display:none!important}.filter-more{margin-top:10px}.filter-more summary,details>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--accent);font-weight:600}.filter-controls{display:flex;flex-wrap:wrap;gap:10px;padding:8px 0}input,select{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px;min-height:44px}.filter-controls>*{flex:1;min-width:125px}.pager{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:20px}.events{border-left:2px solid var(--line);padding-left:16px;margin:15px 0}.event{position:relative;padding:0 0 16px}.event:before{content:"";position:absolute;left:-21px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--accent)}.event .meta{margin:2px 0}.empty{display:flex;align-items:center;gap:12px;color:var(--muted);padding:20px 0}.empty svg{width:36px;height:36px;flex:none;color:var(--accent)}.page{animation:fade .3s ease both}@keyframes fade{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media(max-width:720px){.wrap{padding:22px 16px 56px}.mast{align-items:flex-start;flex-wrap:wrap}.brand{gap:8px;width:100%}.mast-right{width:100%;justify-content:space-between}.leaf{width:32px;height:32px}h1{font-size:26px}.mast-right{gap:8px}.calendar strong{font-size:32px}.calendar span{font-size:12px}.snapshot{width:135px;height:78px;font-size:12px}.snapshot p{font-size:12px}.tabs{margin:22px 0 26px}.tab{padding:10px 16px}.grid{grid-template-columns:1fr}.card{padding:20px}.gauge{gap:16px}.ring{width:146px;flex-basis:146px}.ring .big{font-size:23px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.episode-grid,.facts-grid{grid-template-columns:1fr}.filter-line{flex-wrap:wrap}.filter-line input{flex-basis:100%}.screen-title{align-items:flex-start}.card-head{align-items:flex-start}}
@media(prefers-color-scheme:dark){:root{--bg:#241811;--paper:#35251d;--ink:#f7ead8;--muted:#ddc7ae;--line:#76594a;--accent:#b4cfa1;--rose:#d5a3a0;--peach:#d9a679;--sage:#a9b99a;--sand:#d3b991;--lilac:#bbabbe;--blue:#a6bbc1;--red:#d88a82;--shadow:rgba(0,0,0,.22);--grid:rgba(247,220,177,.08);--tape:rgba(212,167,114,.32)}.button.primary{color:#25301f}.node-icon{color:#293f2b}.node.failed .node-icon{color:#562c27}.stat{color:#38261f}.stat small{color:#38261f}.banner{color:#49342b}.tag{background:#4a3529}}
</style></head><body><main class="wrap"><header class="mast"><div class="brand"><svg class="leaf" viewBox="0 0 48 48" aria-hidden="true"><path d="M8 37C11 19 23 11 40 10c-2 19-13 27-28 27M11 38c9-10 17-16 25-21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M22 25l-3-6m7 3 6 1" fill="none" stroke="currentColor" stroke-width="2"/></svg><div><p class="eyebrow">DSH · MEMORY JOURNAL</p><h1>记忆手帐</h1><p class="muted">把记忆，轻轻放在这里。</p></div></div><div class="mast-right"><div class="calendar" id="date-header"></div><div class="snapshot"><div><span>快照 · 上海</span><p id="snapshot">正在读取</p></div></div></div></header>
<nav class="tabs" aria-label="页面导航"><button class="tab active" data-tab="today">今天</button><button class="tab" data-tab="timeline">上下文时间轴</button><button class="tab" data-tab="facts">记忆库</button></nav><div id="notice" role="status"></div><section id="app" class="page" aria-live="polite"></section></main>
<script>
const app=document.getElementById('app'),notice=document.getElementById('notice');let active='today',selectedDate='',page=1;
const esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'—':Number(n).toLocaleString('zh-CN');
const time=n=>n==null?'时间未记录':new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(typeof n==='number'?n*1000:n));
const actionNames={ADD:'新记',REINFORCE:'加深',UPDATE:'改写',TOMBSTONE:'遗忘',PURGED:'清除'};
const kindNames={identity:'身份',relation:'关系',preference:'偏好',project:'项目',knowledge:'知识',lifestyle:'生活',mood:'心情',other:'其他'};
const kindColors={identity:'#b07968',relation:'#a27484',preference:'#7b9a77',project:'#c38b5b',knowledge:'#718d9c',lifestyle:'#a49969',mood:'#9882a0',other:'#998a7d'};
const sketch='<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 37c7-18 18-25 31-26-3 16-14 25-27 25m-3 2c8-9 17-15 25-20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const empty=message=>`<div class="empty">${sketch}<span>${esc(message)}</span></div>`;
async function api(path){const r=await fetch(path);const v=await r.json();if(!r.ok)throw Error(v.error||'读取失败');if(v.available===false)throw Error(v.message);return v}
function sensitive(content,flag){return flag?`<details><summary>敏感内容 · 点击展开</summary><div>${content}</div></details>`:content}
function eventList(rows){if(!rows.length)return empty('这里还没有事件，留一页空白。');return `<div class="events">${rows.map(e=>`<div class="event"><strong>${esc(actionNames[e.action]||e.action)}</strong><span class="meta"> · ${esc(e.action)} · ${esc(e.actor)}</span><p class="meta">${esc(time(e.at))}</p>${sensitive(`<p>${esc(e.reason??'没有记录原因')}${e.statement?`<br>${esc(e.statement)}`:''}</p>`,e.sensitive)}</div>`).join('')}</div>`}
async function getStatus(){const v=await api('/api/status');document.getElementById('snapshot').textContent=time(v.snapshot_mtime)}
function dateHeader(date){const el=document.getElementById('date-header');if(!el)return;const dt=new Date(date+'T12:00:00+08:00');const month=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'long',weekday:'long'}).format(dt);el.innerHTML=`<strong>${esc(date.slice(8))}</strong><span>${esc(month)}<br>${esc(date.slice(0,4))}</span>`}
function heading(title,sub){return `<div class="screen-title"><div><p class="section-label">a little record</p><h2>${title}</h2><p class="muted">${sub}</p></div></div>`}
function weekChart(days){const actions=['ADD','REINFORCE','UPDATE','TOMBSTONE'], colors=['#718c6c','#b77e56','#b47c75','#8f7a9a'];const max=Math.max(1,...days.map(d=>actions.reduce((a,k)=>a+(d.counts[k]||0),0)));const bars=days.map((d,i)=>{let y=120;return actions.map((a,j)=>{const n=d.counts[a]||0,h=100*n/max;y-=h;return `<rect x="${26+i*47}" y="${y}" width="24" height="${h}" fill="${colors[j]}"><title>${esc(d.date)} ${esc(actionNames[a])}: ${n}</title></rect>`}).join('')+`<text x="${38+i*47}" y="146" text-anchor="middle">${esc(d.date.slice(5).replace('-','/'))}</text>`}).join('');const summary=days.map(d=>`${d.date}：${actions.map(a=>actionNames[a]+' '+(d.counts[a]||0)).join('，')}`).join('；');return `<div class="week-legend">${actions.map((a,i)=>`<span><i class="dot" style="--swatch:${colors[i]}"></i>${actionNames[a]}</span>`).join('')}</div><svg class="week-plot" viewBox="0 0 365 155" role="img" aria-label="${esc(summary)}"><line x1="15" y1="120" x2="355" y2="120" stroke="var(--line)"/><text x="14" y="120" text-anchor="end">0</text><text x="14" y="25" text-anchor="end">${max}</text>${bars}</svg><p class="muted">按上海自然日 · 过去 7 天</p>`}
async function renderToday(){const d=await api('/api/today');const week=await api('/api/week');selectedDate=d.date;dateHeader(d.date);const floor=d.compact_floor, pct=floor==null?0:Math.max(0,Math.min(100,floor/10000));const all=new Map(d.counts.map(x=>[x.action,x.count]));for(const a of ['ADD','REINFORCE','UPDATE','TOMBSTONE','PURGED'])if(!all.has(a))all.set(a,0);const ordered=[...['ADD','REINFORCE','UPDATE','TOMBSTONE','PURGED'].map(a=>[a,all.get(a)]),...[...all].filter(([a])=>!actionNames[a])];
app.innerHTML=heading('今天',`${esc(d.date)} · Asia/Shanghai`)+`<div class="grid"><div><div class="card taped"><div class="card-head"><h3>最近一次压缩后的上下文</h3><span class="muted">容量记录</span></div><div class="gauge"><div class="ring">${floor==null?'<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="49" fill="none" stroke="var(--line)" stroke-width="8"/></svg>':`<svg viewBox="0 0 120 120" role="meter" aria-label="最近一次压缩后的上下文 tokens" aria-valuemin="0" aria-valuemax="1000000" aria-valuenow="${Math.max(0,Math.min(floor,1000000))}"><circle cx="60" cy="60" r="49" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="60" cy="60" r="49" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" pathLength="100" stroke-dasharray="${pct} 100"/></svg>`}<div class="ring-center"><div class="big">${floor==null?'暂无':fmt(floor)}</div><span class="unit">/ 1,000,000</span></div></div><div class="gauge-text"><p>为每一次对话，<br>留一点呼吸的空间。</p><p class="muted">实测上下文 · tokens</p><p class="muted">0 — 1,000,000</p></div></div><div class="row muted keyline"><span>今日主会话用量</span><span>${fmt(d.today_main_usage)} tokens</span></div></div><div class="card"><div class="card-head"><h3>今日动态</h3><span class="muted">点贴纸查看清单</span></div><div class="stats">${ordered.map(([a,c])=>`<button class="stat" data-action="${esc(a)}"><b>${esc(actionNames[a]||a)}</b><small>${esc(a)}</small><strong class="num">${fmt(c)}</strong></button>`).join('')}</div><div id="event-results"></div></div><div class="card taped"><div class="card-head"><h3>近 7 天动态</h3><span class="muted">动作次数</span></div>${weekChart(week.days)}</div></div><aside><div class="card"><div class="card-head"><h3>后台状态</h3><span class="tag">只读快照</span></div><div class="keyval"><p class="muted">回填游标</p><strong>${d.backfill_cursor==null?'还没有记录':esc(fmt(d.backfill_cursor))}</strong></div><div class="keyval"><p class="muted">当日回填 · ${esc(d.backfill_day?.date||'等待记录')}</p><strong>${d.backfill_day?.count==null?'还没有记录':esc(fmt(d.backfill_day.count))+' / 6'}</strong><div class="boxes" aria-label="回填 ${esc(d.backfill_day?.count??0)} / 6">${Array.from({length:6},(_,i)=>`<span class="box ${i<(d.backfill_day?.count??0)?'on':''}">${i<(d.backfill_day?.count??0)?'✓':''}</span>`).join('')}</div></div><div class="keyval"><p class="muted">最近巩固</p><strong>${d.latest?esc(d.latest.kind)+' · '+esc(d.latest.trigger):'还没有记录'}</strong><p class="meta">${d.latest?esc(d.latest.status)+' · '+(d.latest.finished_at==null?'进行中':esc(fmt(d.latest.finished_at-d.latest.started_at))+' 秒'):'有新的记录时会出现在这里'}</p></div><div class="keyval"><p class="muted">待处理提醒</p><strong>${fmt(d.reminders)} / 50</strong><div class="progress" role="img" aria-label="待处理提醒 ${fmt(d.reminders)} / 50"><span style="width:${Math.min(100,Math.max(0,d.reminders*2))}%"></span></div></div></div></aside></div>`;
app.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{try{const v=await api('/api/events?'+new URLSearchParams({date:selectedDate,action:b.dataset.action}));document.getElementById('event-results').innerHTML=`<h3 style="margin-top:24px">${esc(actionNames[b.dataset.action]||b.dataset.action)} · 事件清单</h3>${eventList(v.events)}`}catch(e){document.getElementById('event-results').textContent=e.message}})}
async function renderTimeline(){const d=await api('/api/timeline');app.innerHTML=heading('上下文时间轴','一段一段，按序保存。向两侧滑动查看更多。')+`<div class="card taped"><div class="bookmarks"><div class="bookmark">主水位 · ${d.watermark==null?'等待记录':esc(fmt(d.watermark))}</div><div class="bookmark">回填游标 · ${d.backfill_cursor==null?'等待记录':esc(fmt(d.backfill_cursor))}</div></div><div class="timeline">${d.consolidations.map(c=>`<button class="node ${esc(c.kind)} ${c.trigger==='backfill'?'backfill':''} ${c.status==='failed'?'failed':''}" data-id="${esc(c.id)}"><span class="node-icon"><span>${c.status==='failed'?'×':c.kind==='nap'?'○':c.kind==='deep'?'◇':'⌁'}</span></span><strong>${esc(c.kind)}</strong><small>seq ${esc(fmt(c.upto_seq))}</small><small>${esc(c.status)} · ${esc(c.trigger)}</small></button>`).join('')||empty('这里还没有巩固记录。')}</div><div id="episodes">${empty('点一枚节点，翻开它的情景记忆。')}</div></div>`;
app.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{try{const d=await api('/api/consolidations/'+encodeURIComponent(b.dataset.id)+'/episodes');document.getElementById('episodes').innerHTML=`<h3>情景记忆 · ${esc(b.dataset.id)}</h3><div class="episode-grid">`+(d.episodes.map(e=>`<article class="episode">${sensitive(`<div class="item-title">${esc(e.title)}</div><p>${esc(e.summary??'还没有摘要')}</p>`,e.sensitive)}<p class="meta">${esc(time(e.started_at))} · ${esc(e.status)}</p></article>`).join('')||empty('这一段还没有情景记忆。'))+'</div>'}catch(e){document.getElementById('episodes').textContent=e.message}})}
const options={kind:['identity','relation','preference','project','knowledge','lifestyle','mood','other'],source_kind:['user_explicit','turn','task','consolidated','inferred'],salience:['trivial','normal','notable','explicit','pinned'],status:['active','dormant','superseded','tombstoned','all']};
const names={scope:'范围',kind:'类型',source_kind:'来源',salience:'显著性',status:'状态',user_explicit:'亲口说的',inferred:'推断的',all:'全部'};let filters={status:'active'};
async function renderFacts(){const query=new URLSearchParams({...filters,page:String(page)});const d=await api('/api/facts?'+query);app.innerHTML=heading('记忆库','每一条记忆，都有它自己的位置。')+`<div class="card"><div class="card-head"><h3>记忆分类</h3><span class="muted">${fmt(d.total)} 条结果</span></div><div class="legend">${Object.entries(kindNames).map(([k,v])=>`<span><i class="dot" style="--swatch:${kindColors[k]}"></i>${v}</span>`).join('')}</div><form id="filters"><div class="filter-line"><input name="q" aria-label="搜索事实" placeholder="搜索记忆" value="${esc(filters.q||'')}"><button class="button primary">筛选</button><button type="button" class="button" id="filter-toggle" aria-expanded="false" aria-controls="filter-controls">更多筛选</button></div><div class="filter-controls" id="filter-controls" hidden><input name="scope" aria-label="范围" placeholder="scope · 全部" value="${esc(filters.scope||'')}">${Object.entries(options).map(([k,vals])=>`<select name="${k}" aria-label="${names[k]}">${k==='status'?'':`<option value="">${names[k]} · 全部</option>`}${vals.map(v=>`<option value="${esc(v)}" ${filters[k]===v?'selected':''}>${esc(names[v]||kindNames[v]||v)}</option>`).join('')}</select>`).join('')}</div></form></div><div class="facts-grid">${d.facts.map(f=>`<article class="fact ${f.status==='tombstoned'?'tombstoned':''}" style="--kind:${kindColors[f.kind]||'#998a7d'}">${sensitive(`<div class="item-title">${esc(f.statement)}</div>${f.kind===undefined?`<p class="meta">${esc(f.status)}</p>`:`<div class="badges"><span class="tag">${esc(names[f.source_kind]||'其他 · '+f.source_kind)}</span><span class="tag">${f.salience==='pinned'?'<svg class="tiny-icon" viewBox="0 0 16 16" aria-label="回形针"><path d="M5 8.5 9.5 4a2.1 2.1 0 0 1 3 3l-5.7 5.7a3.1 3.1 0 0 1-4.4-4.4l5.2-5.2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg> ':f.salience==='explicit'?'<svg class="tiny-icon" viewBox="0 0 16 16" aria-label="星"><path d="M8 1 9.8 6l5.2.2-4.1 3.2 1.4 5L8 11.5 3.7 14.4l1.4-5L1 6.2 6.2 6z" fill="currentColor"/></svg> ':''}${esc(f.salience)}</span><span class="tag">使用 ${esc(fmt(f.used_count))} 次</span><span class="tag">${esc(f.status)}</span></div>`}`,f.sensitive)}<p class="meta">最近强化 ${esc(time(f.last_reinforced_at))}</p><div class="fact-actions"><button class="button" data-fact="${esc(f.id)}">查看事件</button><div></div></div></article>`).join('')||empty('没有找到相符的记忆，换个条件试试。')}</div><div class="pager"><button class="button" id="prev" ${page<=1?'disabled':''}>上一页</button><span>${page} / ${Math.max(1,Math.ceil(d.total/50))}</span><button class="button" id="next" ${page*50>=d.total?'disabled':''}>下一页</button></div>`;
app.querySelector('#filter-toggle').onclick=e=>{const c=app.querySelector('#filter-controls');c.hidden=!c.hidden;e.currentTarget.setAttribute('aria-expanded',String(!c.hidden))};app.querySelector('#filters').onsubmit=e=>{e.preventDefault();filters=Object.fromEntries(new FormData(e.currentTarget));page=1;render()};app.querySelector('#prev').onclick=()=>{page--;render()};app.querySelector('#next').onclick=()=>{page++;render()};app.querySelectorAll('[data-fact]').forEach(b=>b.onclick=async()=>{try{const d=await api('/api/facts/'+encodeURIComponent(b.dataset.fact)+'/events');b.nextElementSibling.innerHTML=eventList(d.events)}catch(e){b.nextElementSibling.textContent=e.message}})}
async function render(){try{notice.innerHTML='';await getStatus();if(active==='today')await renderToday();else if(active==='timeline')await renderTimeline();else await renderFacts()}catch(e){document.getElementById('snapshot').textContent='不可用';notice.innerHTML=`<div class="banner">${esc(e.message)}</div>`;app.innerHTML=''}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;app.classList.remove('page');void app.offsetWidth;app.classList.add('page');document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});render();
</script></body></html>
